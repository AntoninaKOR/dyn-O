[project]
name = "ocssm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "tyro>=0.8.14",
    "setuptools==75.6.0",
    "mlflow==2.15.0",
    "azureml-mlflow==1.59.0",
    "huggingface_hub==0.24.6",
    "minari[create]==0.5.0",
    "gym==0.23.0",
    "procgen",
    "udl",
    "sam-2",
    "timm==1.0.8",
    "scipy",
    "scikit-learn==1.5.1",
    "tensorboard",
    "gymnasium==0.28.1",
    "numba==0.60.0",
]

# Dependency groups and conflicts

[dependency-groups]
cu = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "mpmath==1.3.0",
  "xformers==0.0.28",
]
rocm = [
    "torch==2.4.1+rocm6.1",
    "pytorch-triton-rocm==3.0.0",
    "torchvision==0.19.1+rocm6.1",
    "xformers==0.0.28",
]

[tool.uv]
default-groups = []
conflicts = [
    [
      { group = "cu" },
      { group = "rocm" },
    ],
]

# Package source

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", group = "cu" },
  { index = "pytorch-rocm61", group = "rocm" },
]
torchvision = [
  { index = "pytorch-cu121", group = "cu" },
  { index = "pytorch-rocm61", group = "rocm" },
]
xformers = [
  { index = "pytorch-cu121", group = "cu" },
  { index = "pytorch-rocm61", group = "rocm" },
]
pytorch-triton-rocm = { index = "pytorch-rocm61", group = "rocm" }
udl = { path = "./UnifiedDataLoader/" }
sam-2 = { path = "./segment-anything-2/" }
procgen = { url = "https://github.com/kaixin96/procgen-pyramid/releases/download/0.10.7/procgen-0.10.7+224x224-cp310-cp310-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

# Package index

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm61"
url = "https://download.pytorch.org/whl/rocm6.1"
explicit = true

# Ruff settings

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
